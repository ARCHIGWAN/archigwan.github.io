<body><div class="wrap">
<header class="top"><button class="brand" id="homeButton" type="button" aria-label="갤러리 메인으로 이동"><span>CHOI-GWANYEONG</span> ARCHIVE</button><nav class="nav" aria-label="주 메뉴"><button class="active" data-view="gallery">갤러리</button><button data-view="about">소개</button></nav></header>
<main>
<section id="gallery" class="view active"><div class="hero"><div><div class="eyebrow">A PERSONAL PHOTOGRAPHY JOURNAL</div><h1>렌즈로 바라본,<br>세상의 숨은 결들</h1></div><div class="counter"><strong id="count">0</strong> photographs</div></div><div class="gallery-tools"><p>사진을 눌러 숨겨진 결을 찾아보세요.</p><button class="btn" id="addPhoto">＋ 사진 올리기</button></div><div class="gallery-filters" id="galleryFilters" hidden><div class="filter-row"><span class="filter-label">촬영 연도</span><div class="year-tabs" id="yearTabs" aria-label="촬영 연도별 사진"></div></div><div class="filter-row"><span class="filter-label">주제</span><div class="topic-tabs" id="topicTabs" aria-label="주제별 사진"></div></div></div><div class="grid" id="grid"></div><nav class="pagination" id="pagination" aria-label="갤러리 페이지" hidden></nav></section>
<section id="about" class="view"><div class="about"><div class="eyebrow">ABOUT THE PHOTOGRAPHER</div><h1>안녕하세요,<br>사진으로 인사합니다.</h1><p class="about-copy" id="aboutCopy">이곳에 사진가의 이야기를 적어주세요. 어떤 순간을 바라보고, 어떤 마음으로 셔터를 누르는지 들려주세요.</p><button class="btn light" id="editAbout">소개글 작성하기</button></div></section>
</main><footer class="foot"><span>© <span id="year"></span> 빛의 기록</span><span>작은 순간들을 사진으로 기록합니다.</span><span><button class="card-actions" id="adminButton" style="border:0;background:transparent;color:inherit">관리자 로그인</button></span></footer></div>
<div class="modal-back" id="photoModal"><form class="modal" id="photoForm"><h2 id="photoHeading">사진 올리기</h2><label class="field"><span>사진 파일 (최대 50MB)</span><input type="file" id="imageFile" accept="image/*"></label><p class="notice" id="photoUploadStatus" aria-live="polite"></p><label class="field"><span>사진 제목</span><input id="photoTitle" maxlength="80" placeholder="예: 오후의 산책"></label><label class="field"><span>내용과 부연 설명</span><textarea id="photoDesc" maxlength="1200" placeholder="사진에 담긴 이야기나 촬영 장소를 적어주세요."></textarea></label><label class="field"><span>주제</span><input id="photoTopic" list="topicSuggestions" maxlength="40" placeholder="예: 야경, 풍경, 여행"><datalist id="topicSuggestions"></datalist></label><label class="field"><span>촬영 기종</span><input id="cameraModel" maxlength="120" placeholder="예: Canon EOS R5"></label><label class="field"><span>촬영일</span><input id="captureDate" type="date"></label><label class="field"><span>렌즈</span><input id="lensModel" maxlength="160" placeholder="예: RF50mm F1.8 STM"></label><label class="field"><span>ISO</span><input id="photoIso" type="number" min="1" step="1" inputmode="numeric" placeholder="예: 100"></label><label class="field"><span>조리개 (F값)</span><input id="photoAperture" type="number" min="0.1" step="0.1" inputmode="decimal" placeholder="예: 2.8"></label><label class="field"><span>셔터스피드</span><div style="display:flex;align-items:center;gap:8px"><input id="shutterNumerator" type="number" min="1" step="1" inputmode="numeric" placeholder="분자" aria-label="셔터스피드 분자"><span>/</span><input id="shutterDenominator" type="number" min="1" step="1" inputmode="numeric" placeholder="분모" aria-label="셔터스피드 분모"><span>s</span></div><small class="notice">예: 1/500초는 분자 1, 분모 500을 입력하세요.</small></label><div class="modal-actions"><button type="button" class="btn light close">취소</button><button class="btn" id="photoSaveButton" type="submit">저장하기</button></div></form></div>
<div class="modal-back" id="aboutModal"><form class="modal" id="aboutForm"><h2>소개글 작성하기</h2><label class="field"><span>나에 대한 소개</span><textarea id="aboutInput" maxlength="3000" style="min-height:220px" placeholder="사진가로서의 이야기, 좋아하는 장면, 이 공간에 대한 소개를 적어주세요."></textarea></label><div class="modal-actions"><button type="button" class="btn light close">취소</button><button class="btn" type="submit">저장하기</button></div></form></div>
<div class="modal-back" id="loginModal"><form class="modal" id="loginForm"><h2>관리자 로그인</h2><label class="field"><span>이메일</span><input id="loginEmail" type="email" autocomplete="username" required></label><label class="field"><span>비밀번호</span><input id="loginPassword" type="password" autocomplete="current-password" required></label><p class="notice" id="loginMessage">관리자만 사진과 소개글을 관리할 수 있습니다.</p><div class="modal-actions"><button type="button" class="btn light close">취소</button><button class="btn" type="submit">로그인</button></div></form></div>
<div class="viewer-back" id="imageViewer" role="dialog" aria-modal="true" aria-label="사진과 촬영 정보"><button class="viewer-close" id="viewerClose" aria-label="닫기">×</button><button class="viewer-nav viewer-prev" id="viewerPrev" aria-label="이전 사진">‹</button><div class="viewer-layout"><div class="viewer-photo"><img id="viewerImage" alt="확대된 사진"></div><section class="viewer-info"><h2 id="viewerTitle"></h2><p class="viewer-description" id="viewerDescription"></p><h3>PHOTO DETAILS</h3><div class="viewer-details" id="viewerDetails"></div></section></div><button class="viewer-nav viewer-next" id="viewerNext" aria-label="다음 사진">›</button></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
// Supabase Dashboard > Project Settings > API 에서 Project URL과 Publishable key를 입력하세요.
const SUPABASE_URL='https://fwfebgaqswhxcsyrduwr.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_SGRLXHkTA_AHQ0dO3lg0xg_xNO4ar83';
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const MAX_FILE_BYTES=50*1024*1024;
const $=s=>document.querySelector(s), $$=s=>document.querySelectorAll(s), grid=$('#grid');
const ABOUT_KEY='about';let photos=[],displayedPhotos=[],viewerPhotos=[],aboutText='',editingId=null,editingPath=null,pendingUploadPath=null,session=null,selectedYear='all',selectedTopic='all',currentPage=1,viewerIndex=-1;
const fallbackAbout='이곳에 사진가의 이야기를 적어주세요. 어떤 순간을 바라보고, 어떤 마음으로 셔터를 누르는지 들려주세요.';
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function show(id){$(id).classList.add('open')}function hideAll(){$$('.modal-back').forEach(m=>m.classList.remove('open'))}
function setAdminUI(){const isAdmin=!!session;$('#adminButton').textContent=isAdmin?'관리자 로그아웃':'관리자 로그인';$('#addPhoto').hidden=!isAdmin;$('#editAbout').hidden=!isAdmin;render()}
async function loadContent(){const [{data:rows,error:photoError},{data:aboutRow,error:aboutError}]=await Promise.all([
  supabaseClient.from('gallery_posts').select('id,title,description,image_path,created_at,camera_model,lens,iso,aperture,shutter_numerator,shutter_denominator,capture_date,topic').order('created_at',{ascending:false}),
  supabaseClient.from('site_content').select('content').eq('key',ABOUT_KEY).maybeSingle()
]);
if(photoError){console.error(photoError);grid.innerHTML='<div class="empty"><b>갤러리를 불러오지 못했습니다.</b>Supabase 연결과 공개 읽기 정책을 확인해 주세요.</div>';return}
photos=(rows||[]).map(p=>({...p,image:supabaseClient.storage.from('gallery').getPublicUrl(p.image_path).data.publicUrl,date:new Date(p.created_at).toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric'})}));
if(aboutError){console.error(aboutError);aboutText=''}else aboutText=aboutRow?.content||'';render();}
function pageSize(){return innerWidth<=480?3:innerWidth<=760?6:9}
function render(){
$('#count').textContent=photos.length;$('#aboutCopy').textContent=aboutText||fallbackAbout;$('#editAbout').textContent=aboutText?'소개글 수정하기':'소개글 작성하기';grid.innerHTML='';
const years=[...new Set(photos.map(p=>p.capture_date?.slice(0,4)).filter(y=>/^\d{4}$/.test(y||'')))].sort((a,b)=>b.localeCompare(a));if(selectedYear!=='all'&&selectedYear!=='unknown'&&!years.includes(selectedYear))selectedYear='all';
const topics=[...new Set(photos.map(p=>p.topic?.trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ko'));if(selectedTopic!=='all'&&selectedTopic!=='uncategorized'&&!topics.includes(selectedTopic))selectedTopic='all';
const yearTabs=[['all','전체'],...years.map(y=>[y,y]),...(photos.some(p=>!p.capture_date)?[['unknown','날짜 미상']]:[])];$('#yearTabs').innerHTML=yearTabs.map(([value,label])=>`<button type="button" data-year="${value}" class="${selectedYear===value?'active':''}" aria-pressed="${selectedYear===value}">${label}</button>`).join('');
const topicTabs=[['all','전체'],...topics.map(topic=>[topic,topic]),...(photos.some(p=>!p.topic?.trim())?[['uncategorized','미분류']]:[])];$('#topicTabs').innerHTML=topicTabs.map(([value,label])=>`<button type="button" data-topic="${esc(value)}" class="${selectedTopic===value?'active':''}" aria-pressed="${selectedTopic===value}">${esc(label)}</button>`).join('');$('#galleryFilters').hidden=photos.length===0;
const filtered=photos.filter(p=>(selectedYear==='all'||(selectedYear==='unknown'?!p.capture_date:p.capture_date?.startsWith(selectedYear)))&&(selectedTopic==='all'||(selectedTopic==='uncategorized'?!p.topic?.trim():p.topic?.trim()===selectedTopic)));const size=pageSize(),pageCount=Math.max(1,Math.ceil(filtered.length/size));currentPage=Math.min(currentPage,pageCount);
if(!photos.length){grid.innerHTML='<div class="empty"><b>아직 전시된 사진이 없습니다.</b>첫 사진을 올려 나만의 갤러리를 시작해보세요.</div>';$('#pagination').hidden=true;return}
if(!filtered.length){grid.innerHTML='<div class="empty"><b>선택한 조건에 맞는 사진이 없습니다.</b>다른 연도나 주제를 선택해 보세요.</div>'}
const ordered=[...filtered].sort((a,b)=>{if(!a.capture_date)return b.capture_date?1:0;if(!b.capture_date)return -1;return b.capture_date.localeCompare(a.capture_date)});viewerPhotos=ordered;const start=(currentPage-1)*size;displayedPhotos=ordered.slice(start,start+size);
displayedPhotos.forEach(p=>{const article=document.createElement('article');article.className='card';const cameraInfo=p.camera_model?`<div class="camera-line">${esc(p.camera_model)}</div>`:'';const lensInfo=`<div class="camera-line lens-line">${p.lens?esc(p.lens):'-'}</div>`;const captureInfo=p.capture_date?`<div class="camera-line capture-date-line">촬영일 ${esc(p.capture_date.replaceAll('-','.'))}</div>`:'';const exposureInfo=[];if(p.iso)exposureInfo.push(`ISO ${esc(p.iso)}`);if(p.aperture)exposureInfo.push(`F ${esc(String(Number(p.aperture)))}`);if(p.shutter_numerator&&p.shutter_denominator)exposureInfo.push(`${esc(p.shutter_numerator)}${Number(p.shutter_denominator)===1?'':`/${esc(p.shutter_denominator)}`} s`);article.innerHTML=`<div class="photo"><img src="${esc(p.image)}" alt="${esc(p.title||'사진')}" loading="lazy" tabindex="0" role="button" aria-label="${esc(p.title||'사진')} 확대 보기"></div><div class="card-meta"><div><h3>${esc(p.title||'제목 없는 사진')}</h3><p class="card-description">${esc(p.description||'')}</p>${cameraInfo}${lensInfo}${captureInfo}${exposureInfo.length?`<div class="settings-line">${exposureInfo.join(' | ')}</div>`:''}</div><small>${esc(p.date||'')}</small></div>${session?`<div class="card-actions"><button data-edit="${esc(p.id)}">수정</button><button data-delete="${esc(p.id)}">삭제</button></div>`:''}`;const img=article.querySelector('.photo img');img.onclick=()=>openViewer(p);img.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openViewer(p)}};grid.append(article);const description=article.querySelector('.card-description');if(description&&description.scrollHeight>description.clientHeight+1){const more=document.createElement('button');more.type='button';more.className='description-more';more.textContent='메모 더보기';more.onclick=()=>openViewer(p);description.after(more)}});

function renderViewerPhoto(){const p=viewerPhotos[viewerIndex];if(!p)return;$('#viewerImage').src=p.image;$('#viewerImage').alt=p.title||'사진 확대';$('#viewerTitle').textContent=p.title||'제목 없는 사진';$('#viewerDescription').textContent=p.description||'';const details=[];if(p.topic)details.push(['주제',p.topic]);if(p.camera_model)details.push(['카메라',p.camera_model]);if(p.lens)details.push(['렌즈',p.lens]);if(p.capture_date)details.push(['촬영일',p.capture_date.replaceAll('-','.')]);if(p.iso)details.push(['ISO',p.iso]);if(p.aperture)details.push(['조리개',`F ${Number(p.aperture)}`]);if(p.shutter_numerator&&p.shutter_denominator)details.push(['셔터스피드',`${p.shutter_numerator}${Number(p.shutter_denominator)===1?'':`/${p.shutter_denominator}`} s`]);$('#viewerDetails').innerHTML=details.length?details.map(([label,value])=>`<div class="viewer-detail"><span>${esc(label)}</span><span>${esc(value)}</span></div>`).join(''):'<p class="notice">등록된 촬영 정보가 없습니다.</p>';$('#viewerPrev').disabled=viewerIndex<=0;$('#viewerNext').disabled=viewerIndex>=viewerPhotos.length-1}

function makeUploadPath(file){const ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg';return `${session.user.id}/${crypto.randomUUID()}.${ext}`}
function gcd(a,b){return b?gcd(b,a%b):Math.abs(a)}function shutterFraction(seconds){if(!Number.isFinite(seconds)||seconds<=0)return null;let bestN=1,bestD=1,bestError=Infinity;for(let d=1;d<=10000;d++){const n=Math.max(1,Math.round(seconds*d)),error=Math.abs(seconds-n/d);if(error<bestError){bestN=n;bestD=d;bestError=error;if(error<1e-8)break}}const divisor=gcd(bestN,bestD);return{numerator:bestN/divisor,denominator:bestD/divisor}}
function uploadResumable(path,file){return new Promise(async(resolve,reject)=>{try{const {data:{session:currentSession},error}=await supabaseClient.auth.getSession();if(error)throw error;if(!currentSession)throw new Error('관리자 로그인이 필요합니다.');const projectRef=new URL(SUPABASE_URL).hostname.split('.')[0];const upload=new window.tus.Upload(file,{endpoint:`https://${projectRef}.storage.supabase.co/storage/v1/upload/resumable`,retryDelays:[0,3000,5000,10000,20000],headers:{authorization:`Bearer ${currentSession.access_token}`,apikey:SUPABASE_PUBLISHABLE_KEY},metadata:{bucketName:'gallery',objectName:path,contentType:file.type||'application/octet-stream',cacheControl:'3600'},chunkSize:6*1024*1024,removeFingerprintOnSuccess:true,fingerprint:()=>Promise.resolve(`${SUPABASE_URL}:${path}:${file.name}:${file.size}:${file.lastModified}`),onError:reject,onProgress:(sent,total)=>{$('#photoUploadStatus').textContent=`사진 업로드 중… ${Math.floor(sent/total*100)}%`},onSuccess:resolve});const previous=await upload.findPreviousUploads();if(previous.length)upload.resumeFromPreviousUpload(previous[0]);upload.start()}catch(error){reject(error)}})}
function openPhoto(id=null){if(!session){alert('관리자 로그인이 필요합니다.');return}editingId=id;pendingUploadPath=null;const p=id?photos.find(x=>x.id===id):null;editingPath=p?.image_path||null;$('#photoHeading').textContent=p?'사진 수정하기':'사진 올리기';$('#photoTitle').value=p?.title||'';$('#photoDesc').value=p?.description||'';$('#photoTopic').value=p?.topic||'';$('#topicSuggestions').innerHTML=[...new Set(photos.map(item=>item.topic?.trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ko')).map(topic=>`<option value="${esc(topic)}"></option>`).join('');$('#cameraModel').value=p?.camera_model||'';$('#captureDate').value=p?.capture_date||'';$('#lensModel').value=p?.lens||'';$('#photoIso').value=p?.iso??'';$('#photoAperture').value=p?.aperture??'';$('#shutterNumerator').value=p?.shutter_numerator??'';$('#shutterDenominator').value=p?.shutter_denominator??'';$('#imageFile').value='';$('#photoUploadStatus').textContent='';show('#photoModal')}

const isoRaw=$('#photoIso').value.trim(),apertureRaw=$('#photoAperture').value.trim(),shutterNumeratorRaw=$('#shutterNumerator').value.trim(),shutterDenominatorRaw=$('#shutterDenominator').value.trim();if(isoRaw&&!/^\d+$/.test(isoRaw)){alert('ISO는 양의 정수만 입력해 주세요.');return}if(apertureRaw&&!/^\d+(\.\d+)?$/.test(apertureRaw)){alert('조리개 값은 양수만 입력해 주세요.');return}if((shutterNumeratorRaw&&!shutterDenominatorRaw)||(!shutterNumeratorRaw&&shutterDenominatorRaw)){alert('셔터스피드는 분자와 분모를 모두 입력해 주세요.');return}if(shutterNumeratorRaw&&(!/^\d+$/.test(shutterNumeratorRaw)||!/^\d+$/.test(shutterDenominatorRaw)||Number(shutterNumeratorRaw)<1||Number(shutterDenominatorRaw)<1)){alert('셔터스피드는 양의 정수만 입력해 주세요.');return}if(isoRaw&&Number(isoRaw)<1||apertureRaw&&Number(apertureRaw)<=0){alert('촬영 수치는 0보다 큰 값이어야 합니다.');return}

$('#imageFile').onchange=async e=>{
const file=e.target.files[0];if(!file){pendingUploadPath=null;$('#photoUploadStatus').textContent='';return}
if(!file.type.startsWith('image/')||file.size>MAX_FILE_BYTES){alert('50MB 이하의 이미지 파일을 선택해 주세요.');e.target.value='';pendingUploadPath=null;return}
pendingUploadPath=makeUploadPath(file);$('#photoUploadStatus').textContent=`선택됨: ${(file.size/1024/1024).toFixed(1)}MB · EXIF 정보를 확인하는 중…`;

const exif=await window.exifr.parse(file,['Make','Model','UniqueCameraModel','LensModel','LensID','LensSpecification','ISO','ISOSpeedRatings','PhotographicSensitivity','FNumber','ApertureValue','ExposureTime','ShutterSpeedValue','DateTimeOriginal','CreateDate','DateTimeDigitized']);if($('#imageFile').files[0]!==file)return;let found=false;

let lens=exif.LensModel||exif.LensID;if(!lens&&Array.isArray(exif.LensSpecification)&&exif.LensSpecification.length>=4){const [minFocal,maxFocal,minAperture,maxAperture]=exif.LensSpecification.map(Number);if([minFocal,maxFocal,minAperture,maxAperture].every(Number.isFinite))lens=`${minFocal}-${maxFocal}mm F${minAperture}-${maxAperture}`}if(lens){$('#lensModel').value=String(lens).trim();found=true}
const iso=[exif.ISO,exif.PhotographicSensitivity,exif.ISOSpeedRatings].map(Number).find(n=>Number.isFinite(n)&&n>0);if(iso){$('#photoIso').value=String(Math.round(iso));found=true}
